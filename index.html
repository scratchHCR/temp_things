<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>2026元旦跨年倒计时</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景图片层 -->
    <div id="background-image"></div>
    
    <!-- 黑色蒙版层 -->
    <div id="background-mask"></div>
    
    <!-- 原始画布 -->
    <canvas id="bgCanvas"></canvas>
    <canvas id="fireworkCanvas"></canvas>
    
    <!-- 原始倒计时容器 -->
    <div id="border-decoration">
        <div id="countdown">
            <!-- 添加这一行文字 -->
            <div id="countdown-label">距离2026年还有：</div>
            <div id="timer"></div>
            <div id="blessing">辞旧迎新，万象更新。<br>愿您在新的一年里，<br>事业如龙腾虎跃，生活如诗如画，<br>健康如意，万事顺遂，<br>元旦快乐，阖家幸福！</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
